# Four apps in one workspace. A deploy uploads each app's own path and nothing
# else (the machine running the deploy does the git checkout), so data/model/ never
# reaches the workspace; the release uploader refuses a file over about 2 MB anyway.
#
# Shared data lives on the persistent volume: data/model is the frozen research
# snapshot and data/tv-model holds the nightly model, source data and ratings cache.
# /home/developer/model and /home/developer/tv-model are stable links into that volume.
# Apps use these shared host paths: Rigbox's per-app volumes: [data] would bind a
# private app directory over the volume root and hide the shared models.
# Each start checks the volume mount and its data link before opening persistent data.
# When current moves, Next Watch and Couchside restart after their own delays.
name: tv-taste
visibility: public

workspace:
  image: base
  volumes:
    - name: data
      mountPath: /home/developer/data
      sizeMb: 1024
  # Three engines hold about 350 MB each here; a nightly build peaks near 1 GB.
  resources: { ramMb: 3072, vcpuCount: 1, diskSizeMb: 5120 }
  deployment:
    strategy: incremental
apps:
  tv-taste:
    path: ./site
    port: 8080
    visibility: public
    start: mountpoint -q /home/developer/data && test -L /home/developer/model && python3 -m backend.server
    env:
      MODEL_DIR: /home/developer/model
    health:
      path: /healthz
      timeoutSeconds: 60
    source:
      kind: git
      repo: https://github.com/jona62/tv-show-research.git
      branch: main

  next-watch:
    path: ./app
    port: 8081
    visibility: public
    install: python3 -m venv --copies .venv && .venv/bin/pip install --no-cache-dir -r requirements-runtime.txt
    dependencyInputs: [ requirements-runtime.txt ]
    start: mountpoint -q /home/developer/data && test -L /home/developer/tv-model && .venv/bin/python -m backend.server
    env:
      PORT: "8081"
      MODEL_DIR: /home/developer/tv-model/current
      RELOAD_DELAY_SECONDS: "30"
      OUTBOUND_CACHE: /home/developer/tv-model/cache/http.sqlite3
    health:
      path: /healthz
      timeoutSeconds: 90
    source:
      kind: git
      repo: https://github.com/jona62/tv-show-research.git
      branch: main

  couchside:
    path: ./couchside
    port: 8082
    visibility: public
    install: python3 -m venv --copies .venv && .venv/bin/pip install --no-cache-dir -r requirements-runtime.txt
    dependencyInputs: [ requirements-runtime.txt ]
    start: mountpoint -q /home/developer/data && test -L /home/developer/tv-model && .venv/bin/python -m backend.server
    env:
      PORT: "8082"
      MODEL_DIR: /home/developer/tv-model/current
      RELOAD_DELAY_SECONDS: "150"
      RATINGS_CACHE: /home/developer/tv-model/cache/episode-ratings.sqlite3
      OUTBOUND_CACHE: /home/developer/tv-model/cache/http.sqlite3
      ACCOUNT_DB: /home/developer/data/accounts/couchside.sqlite3
      ACCOUNT_HTTPS_ONLY: "1"
    secrets:
      - name: TMDB_API_KEY
        from: TMDB_READ_API
        optional: true
    health:
      path: /healthz
      timeoutSeconds: 120
    source:
      kind: git
      repo: https://github.com/jona62/tv-show-research.git
      branch: main

  # Rebuilds a live model from fresh TVmaze data every night at 04:30 UTC, adding TMDB's
  # where to watch, ratings and trailers when TMDB_API_KEY is set, into
  # /home/developer/data/tv-model, then repoints tv-model/current. It rebuilds on deploy when
  # the pipeline changes. Private, with a status page and a Rebuild now button; see
  # pipeline/backend/refresher.py. The build peaks near 1.1 GB, so it is capped below the servers.
  model-refresher:
    path: ./pipeline
    port: 8083
    install: python3 -m venv --copies .venv && .venv/bin/pip install --no-cache-dir -r requirements-refresher.txt
    dependencyInputs: [ requirements-refresher.txt ]
    start: mountpoint -q /home/developer/data && test -L /home/developer/tv-model && test -L /home/developer/model && .venv/bin/python -m backend.refresher
    health:
      path: /healthz
      timeoutSeconds: 60
    restartPolicy: always
    limits:
      memoryMaxMb: 1500
      cpuPercent: 60
    # TMDB's read access token, pasted into the GitHub connection's runtime secrets as
    # TMDB_READ_API=... (the same line as in a local .env) and forwarded as TMDB_API_KEY.
    # Optional: without it TMDB is simply off.
    secrets:
      - name: TMDB_API_KEY
        from: TMDB_READ_API
        optional: true
    env:
      PORT: "8083"
      MODEL_ROOT: /home/developer/tv-model
      SEED_MODEL_DIR: /home/developer/model
      REFRESH_AT_UTC: "04:30"
      OUTBOUND_CACHE: /home/developer/tv-model/cache/http.sqlite3
    source:
      kind: git
      repo: https://github.com/jona62/tv-show-research.git
      branch: main
