# All three apps in one workspace, sharing one copy of the 46MB model.
#
# model/ sits outside every app directory on purpose: the release uploader
# refuses a blob over about 2MB, so the model is copied to /home/developer/model
# once over SSH and named in MODEL_DIR (see app/README.md). A git-source deploy,
# which clones the whole repo, finds model/ beside the apps and ignores it.
name: tv-taste
visibility: public

workspace:
  image: base
  # Three engines hold about 650MB resident each, under 2GB together.
  resources: { ramMb: 3072, vcpuCount: 1, diskSizeMb: 5120 }
  deployment:
    strategy: incremental
apps:
  tv-taste:
    path: ./site
    port: 8080
    visibility: public
    start: python3 server.py
    env:
      MODEL_DIR: /home/developer/model
    health:
      path: /healthz
      timeoutSeconds: 60
    source:
      kind: git
      repo: https://github.com/jona62/tv-show-research.git
      branch: main

  next-watch:
    path: ./app
    port: 8081
    visibility: public
    start: python3 server.py
    env:
      PORT: "8081"
      MODEL_DIR: /home/developer/model
    health:
      path: /healthz
      timeoutSeconds: 90
    source:
      kind: git
      repo: https://github.com/jona62/tv-show-research.git
      branch: main

  couchside:
    path: ./couchside
    port: 8082
    visibility: public
    start: python3 server.py
    env:
      PORT: "8082"
      MODEL_DIR: /home/developer/model
    health:
      path: /healthz
      timeoutSeconds: 120
    source:
      kind: git
      repo: https://github.com/jona62/tv-show-research.git
      branch: main

  # Rebuilds a live model from fresh TVmaze data every night at 04:30 UTC, adding TMDB's
  # where to watch, ratings and trailers when TMDB_API_KEY is set, into
  # /home/developer/tv-model, then repoints tv-model/current. It rebuilds on deploy when
  # the pipeline changes. Private, with a status page and a Rebuild now button; see
  # scripts/refresher.py. The build peaks near 1.1 GB, so it is capped below the servers.
  model-refresher:
    path: ./scripts
    port: 8083
    install: python3 -m venv --copies .venv && .venv/bin/pip install --no-cache-dir -r requirements-refresher.txt
    dependencyInputs: [requirements-refresher.txt]
    start: .venv/bin/python refresher.py
    health:
      path: /healthz
      timeoutSeconds: 60
    restartPolicy: always
    limits:
      memoryMaxMb: 1500
      cpuPercent: 60
    secrets:
      - name: TMDB_API_KEY
        optional: true
    env:
      PORT: "8083"
      MODEL_ROOT: /home/developer/tv-model
      SEED_MODEL_DIR: /home/developer/model
      REFRESH_AT_UTC: "04:30"
    source:
      kind: git
      repo: https://github.com/jona62/tv-show-research.git
      branch: main
