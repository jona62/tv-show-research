# Four apps in one workspace. A deploy uploads each app's own path and nothing
# else (the machine running the deploy does the git checkout), so model/ never
# reaches the workspace; the release uploader refuses a file over about 2 MB anyway.
#
# The research site reads the frozen September snapshot, copied once over SSH to
# /home/developer/data/model on the persistent Rigbox volume. model-refresher
# rebuilds a live model from fresh TVmaze data every night into
# /home/developer/data/tv-model, and Next Watch and Couchside read its current link.
# Couchside's SQLite ratings cache lives on the same volume. When current moves,
# each app restarts on the new model after its own delay, so the two are never
# down together.
# Each start checks the volume mount before opening or creating persistent data.
name: tv-taste
visibility: public

workspace:
  image: base
  volumes:
    - name: data
      mountPath: /home/developer/data
      sizeMb: 1024
  # Three engines hold about 350 MB each here; a nightly build peaks near 1 GB.
  resources: { ramMb: 3072, vcpuCount: 1, diskSizeMb: 5120 }
  deployment:
    strategy: incremental
apps:
  tv-taste:
    path: ./site
    volumes: [data]
    port: 8080
    visibility: public
    start: mountpoint -q /home/developer/data && python3 server.py
    env:
      MODEL_DIR: /home/developer/data/model
    health:
      path: /healthz
      timeoutSeconds: 60
    source:
      kind: git
      repo: https://github.com/jona62/tv-show-research.git
      branch: main

  next-watch:
    path: ./app
    volumes: [data]
    port: 8081
    visibility: public
    start: mountpoint -q /home/developer/data && python3 server.py
    env:
      PORT: "8081"
      MODEL_DIR: /home/developer/data/tv-model/current
      RELOAD_DELAY_SECONDS: "30"
    health:
      path: /healthz
      timeoutSeconds: 90
    source:
      kind: git
      repo: https://github.com/jona62/tv-show-research.git
      branch: main

  couchside:
    path: ./couchside
    volumes: [data]
    port: 8082
    visibility: public
    start: mountpoint -q /home/developer/data && python3 server.py
    env:
      PORT: "8082"
      MODEL_DIR: /home/developer/data/tv-model/current
      RELOAD_DELAY_SECONDS: "150"
      RATINGS_CACHE: /home/developer/data/tv-model/cache/episode-ratings.sqlite3
    secrets:
      - name: TMDB_API_KEY
        from: TMDB_READ_API
        optional: true
    health:
      path: /healthz
      timeoutSeconds: 120
    source:
      kind: git
      repo: https://github.com/jona62/tv-show-research.git
      branch: main

  # Rebuilds a live model from fresh TVmaze data every night at 04:30 UTC, adding TMDB's
  # where to watch, ratings and trailers when TMDB_API_KEY is set, into
  # /home/developer/data/tv-model, then repoints tv-model/current. It rebuilds on deploy when
  # the pipeline changes. Private, with a status page and a Rebuild now button; see
  # scripts/refresher.py. The build peaks near 1.1 GB, so it is capped below the servers.
  model-refresher:
    path: ./scripts
    volumes: [data]
    port: 8083
    install: python3 -m venv --copies .venv && .venv/bin/pip install --no-cache-dir -r requirements-refresher.txt
    dependencyInputs: [ requirements-refresher.txt ]
    start: mountpoint -q /home/developer/data && .venv/bin/python refresher.py
    health:
      path: /healthz
      timeoutSeconds: 60
    restartPolicy: always
    limits:
      memoryMaxMb: 1500
      cpuPercent: 60
    # TMDB's read access token, pasted into the GitHub connection's runtime secrets as
    # TMDB_READ_API=... (the same line as in a local .env) and forwarded as TMDB_API_KEY.
    # Optional: without it TMDB is simply off.
    secrets:
      - name: TMDB_API_KEY
        from: TMDB_READ_API
        optional: true
    env:
      PORT: "8083"
      MODEL_ROOT: /home/developer/data/tv-model
      SEED_MODEL_DIR: /home/developer/data/model
      REFRESH_AT_UTC: "04:30"
    source:
      kind: git
      repo: https://github.com/jona62/tv-show-research.git
      branch: main
